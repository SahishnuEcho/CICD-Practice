on:
    push:
        branches:
            [main]

jobs:
    build-backend:
        name: build-backend
        defaults:
            run:
                working-directory:
                    ./apps/backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: 
                node-version: 24
            - run: cd apps/backend
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm run test:e2e
