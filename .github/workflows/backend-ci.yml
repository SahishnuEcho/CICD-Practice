name: backend-ci-workflow

on:
    pull_request:
        branches:
            [main]
    push:
        branches:
            [main]
    workflow_dispatch:

jobs:
    build-backend:
        name: build-backend
        defaults:
            run:
                working-directory:
                    ./apps/backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with: 
                node-version: 24
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm run test
            - run: npm run test:e2e

    publish-backend:
        name: publish-backend
        needs: build-backend
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        defaults:
            run:
                working-directory:
                    ./apps/backend
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: echo ${{ secrets.GITHUB_TOKEN }}| docker login ghcr.io -u ${{ github.actor }} --password-stdin
            - run: docker build -t ghcr.io/sahishnuecho/backend:${{ github.sha }} -t backend:latest .
            - run: docker push ghcr.io/sahishnuecho/backend:${{ github.sha }}
            - run: docker push ghcr.io/sahishnuecho/backend:latest




